<!doctype html>
<!--
  PROTOTYPE: throwaway. Answers ticket 0003 "How should the balloon intro and hero look?"
  Two variants (A Balloon Arch Stage, C Storybook Polaroid) + auto balloon intro + "12 Little Birthdays" month section.
  Switch via the top bar, ?variant=A|C and ?intro=balloons|confetti. Open by double-clicking.
  Ganesh: uses assets/img/ganesh.png if present, else assets/img/ganesh-icon.svg
  (Ganesha icon by Ameya Narvankar, The Noun Project, CC BY-SA 3.0).
  Missing month photos: photos/months/m01.jpg, m02.jpg, m03.jpg
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Avkrit intro + hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&family=Fredoka:wght@400;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#2b2b33;font-family:Fredoka,system-ui,sans-serif;color:#2d2a32;-webkit-font-smoothing:antialiased}
  .phone{max-width:460px;margin:0 auto;min-height:100svh;position:relative;overflow:hidden;background:#fff;padding-top:58px}
  .deva{font-family:"Tiro Devanagari Sanskrit","Baloo 2",serif}
  img{max-width:100%}

  /* shared bits */
  .ganesh{width:64px;height:64px;margin:0 auto 4px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;
    box-shadow:0 0 0 3px #f5c542,0 4px 12px rgba(0,0,0,.12)}
  .ganesh img{width:78%;height:78%;object-fit:contain}
  .blessing{text-align:center;color:#8a5a00;font-size:16px;letter-spacing:.5px}
  .photo{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .photo-ph{width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;text-align:center;
    background:repeating-linear-gradient(45deg,#fff4d6 0 10px,#ffeec2 10px 20px);color:#a87b12;font:600 12px/1.3 Fredoka,sans-serif}
  .photo-ph span{font-size:28px;display:block}
  .stub{padding:40px 24px 60px;text-align:center;color:#888;font-size:14px;background:#fafafa;border-top:1px dashed #ddd}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:160%;left:15%;top:-70%}
  .cloud::after{width:40%;height:130%;right:12%;top:-45%}
  .scroll-cue{text-align:center;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;padding:10px 0 18px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(5px)}}

  /* ============ VARIANT A: Balloon Arch Stage ============ */
  .A{background:linear-gradient(#7cc8ff 0%,#bfe6ff 55%,#e9f7ff 70%);padding-top:18px;position:relative}
  .A .top{position:relative;z-index:3}
  .A .lg{width:132px;height:132px;margin:12px auto 0;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 4px #f5c542,0 8px 18px rgba(0,0,0,.18);overflow:hidden}
  .A .lg-cap{text-align:center;font:600 14px Fredoka;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);margin-top:8px}
  .A .kicker{text-align:center;font:700 26px/1 Fredoka;color:#fff;text-shadow:0 2px 0 #2f86c9,0 4px 10px rgba(0,0,0,.15);margin-top:18px}
  .A .arch{position:relative;width:100%;aspect-ratio:1/.86;margin-top:-6px}
  .A .b{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 7%,var(--c) 30%,color-mix(in srgb,var(--c) 70%,#000) 100%);
    box-shadow:inset -3px -4px 8px rgba(0,0,0,.12)}
  .A .backdrop{position:absolute;left:14%;right:14%;top:30%;bottom:0;border-radius:14px 14px 0 0;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px),linear-gradient(#3a9d45,#257a2f)}
  .A .rainbow{position:absolute;left:16%;top:36%;width:44%;aspect-ratio:2/1;border-radius:200px 200px 0 0;
    background:radial-gradient(circle at 50% 100%,transparent 42%,#8e44ad 42% 47%,#3d7bf0 47% 54%,#2fbf55 54% 61%,#ffd23f 61% 68%,#ff8c2a 68% 75%,#f0453a 75% 82%,transparent 82%);opacity:.85}
  .A .photo-wrap{position:absolute;left:50%;top:60%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    border:6px solid #fff;box-shadow:0 0 0 4px #f5c542,0 10px 24px rgba(0,0,0,.25);z-index:2}
  .A .photo-wrap .crown{position:absolute;width:44%;left:50%;top:-24%;transform:translateX(-50%) rotate(-8deg);z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
  .A .stage{position:relative;background:linear-gradient(#7ccf4a,#5cb338);padding:16px 12px 18px;border-top:6px solid #4c9a2c;z-index:2}
  .A .stage::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:#b33a3a}
  .A .marquee{display:flex;justify-content:center;gap:4px;margin:-46px 0 6px}
  .A .marquee span{font:700 44px/1 Fredoka;color:#fff7d6;padding:2px 4px;text-shadow:0 0 6px #ffd76a,0 0 14px #ffb800,0 3px 0 #c98f00}
  .A .turns{text-align:center;font:600 20px/1.2 Fredoka;color:#fff;text-shadow:0 2px 0 #3d7f20}
  .A .turns b{font-size:56px;color:#ffd23f;text-shadow:0 3px 0 #c98f00,0 0 12px rgba(255,210,63,.6);vertical-align:middle}
  .A .stage .bus{position:absolute;width:90px;left:6px;bottom:22px}
  .A .stage .melon{position:absolute;width:44px;right:10px;bottom:26px}
  .A .stage .melon2{right:52px;width:34px;bottom:22px}
  .A .info{background:#b33a3a;color:#fff;text-align:center;padding:22px 16px 6px;
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 10px)}
  .A .pill{display:inline-block;background:#fff;color:#b33a3a;border-radius:999px;padding:8px 16px;font:600 16px Fredoka}
  .A .venue{margin-top:8px;font-size:15px;opacity:.95}
  /* A months: balloon grid */
  .A-months{background:linear-gradient(#e9f7ff,#bfe6ff);padding:30px 14px 34px;position:relative;overflow:hidden}
  .A-months h2{text-align:center;font:700 28px/1.1 Fredoka;color:#1f6fb2;text-shadow:0 2px 0 #fff;margin:0}
  .A-months .sub{text-align:center;color:#2f6f9f;font-size:14px;margin:6px 0 20px}
  .A-months .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px}
  .A-months .m{text-align:center;position:relative}
  .A-months .ball{width:88%;aspect-ratio:1/1.08;margin:0 auto;border-radius:50% 50% 48% 48%;border:5px solid var(--c);overflow:hidden;background:#fff;
    box-shadow:0 6px 12px rgba(0,0,0,.12)}
  .A-months .knot{width:0;height:0;margin:-1px auto 0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c)}
  .A-months .str{width:1.5px;height:14px;margin:0 auto;background:#7a8aa0}
  .A-months .lbl{font:700 14px/1.1 Fredoka;color:#2d4a63}
  .A-months .lbl small{display:block;font:400 12px Fredoka;color:#5a7690}
  .A-months .big .ball{border-color:#f5c542;background:#fffaf0;display:grid;place-items:center}
  .A-months .big .ball b{font:700 44px/1 Fredoka;color:#ffd23f;text-shadow:0 3px 0 #c98f00}

  /* ============ VARIANT C: Storybook Polaroid ============ */
  .C{background:linear-gradient(#fde4ee 0%,#e6f1ff 60%,#f4fbff 100%);position:relative;padding:22px 20px 0;display:flex;flex-direction:column}
  .C .lg{width:46%;margin:14px auto 0;background:#fff;padding:7px 7px 30px;transform:rotate(3deg);box-shadow:0 8px 18px rgba(60,40,80,.18);position:relative}
  .C .lg .ph{aspect-ratio:1;overflow:hidden}
  .C .lg .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:700 20px/1 Caveat;color:#3a3550}
  .C .bunch{position:relative;height:200px;margin-top:20px}
  .C .bunch svg{position:absolute}
  .C .polaroid{position:relative;width:72%;margin:-40px auto 0;background:#fff;padding:10px 10px 46px;transform:rotate(-4deg);
    box-shadow:0 14px 30px rgba(60,40,80,.22);border-radius:3px;z-index:2}
  .C .polaroid .ph{aspect-ratio:4/5;border-radius:2px;overflow:hidden}
  .C .polaroid .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 30px/1 Caveat;color:#3a3550}
  .C .polaroid .crown{position:absolute;width:70px;right:-22px;top:-28px;transform:rotate(18deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
  .C .tape{position:absolute;width:70px;height:22px;background:rgba(255,236,170,.75);left:50%;top:-11px;transform:translateX(-50%) rotate(3deg)}
  .C h1{font:700 40px/1.05 Caveat;text-align:center;margin:26px 0 4px;color:#3a3550}
  .C h1 em{font-style:normal;color:#e24d6a}
  .C .meta{text-align:center;font:400 15px/1.6 Fredoka;color:#5a5570}
  .C .meta b{font-weight:600;color:#3a3550}
  .C .hill{margin:10px -20px 0;position:relative;height:130px}
  .C .hill svg.ground{position:absolute;bottom:0;width:100%;height:100%}
  .C .hill .bus{position:absolute;width:86px;left:16%;bottom:44px}
  .C .hill .melon{position:absolute;width:40px;right:18%;bottom:40px}
  /* C months: clothesline */
  .C-months{background:#6cc04a;padding:26px 0 30px;position:relative}
  .C-months h2{font:700 36px/1 Caveat;text-align:center;color:#fff;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.12)}
  .C-months .sub{text-align:center;color:#eaffdc;font-size:14px;margin:6px 20px 8px}
  .C-months .hint{text-align:center;color:#eaffdc;font-size:12px;opacity:.8}
  .C-months .line{position:relative;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:26px 20px 18px}
  .C-months .row{display:flex;gap:16px;width:max-content;position:relative;padding-top:6px}
  .C-months .row::before{content:"";position:absolute;left:-20px;right:-20px;top:0;height:2px;background:#8b5a2b;border-radius:2px}
  .C-months .pc{width:138px;background:#fff;padding:7px 7px 34px;position:relative;scroll-snap-align:center;
    box-shadow:0 8px 16px rgba(0,0,0,.18);transform:rotate(var(--r));transform-origin:50% -10px}
  .C-months .pc .ph{aspect-ratio:1;overflow:hidden}
  .C-months .pc .cap{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:700 19px/1 Caveat;color:#3a3550}
  .C-months .pc .cap small{display:block;font:400 11px Fredoka;color:#8a85a0;margin-top:1px}
  .C-months .peg{position:absolute;left:50%;top:-14px;width:10px;height:24px;background:#d9a066;border-radius:2px;transform:translateX(-50%);box-shadow:inset -2px 0 0 #b9814a}
  .C-months .big .ph{display:grid;place-items:center;background:#fff8e1}
  .C-months .big .ph b{font:700 64px/1 Caveat;color:#e24d6a}

  /* ============ INTRO ============ */
  #intro{position:fixed;inset:0;z-index:50;pointer-events:auto;overflow:hidden}
  #intro .bg{position:absolute;inset:0;background:linear-gradient(#7cc8ff,#e9f7ff);animation:fadebg 1s ease .9s forwards}
  @keyframes fadebg{to{opacity:0}}
  #intro .ib{position:absolute;animation:up var(--d) cubic-bezier(.45,0,.7,1) var(--delay) forwards}
  @keyframes up{to{transform:translateY(-135vh) rotate(var(--rot))}}
  #intro .hello{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);opacity:0;text-align:center;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) .1s forwards, up 1.6s cubic-bezier(.45,0,.7,1) .9s forwards;--rot:0deg;z-index:5}
  #intro .hello .t{font:700 38px/1 Fredoka;color:#fff;text-shadow:0 3px 0 #2f86c9,0 6px 16px rgba(0,0,0,.2);white-space:nowrap}
  #intro .hello svg{width:80px}
  @keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #intro.confetti .bg{background:transparent;animation:none}
  #intro .cf{position:absolute;left:50%;top:45%;width:9px;height:14px;border-radius:2px;animation:burst var(--d) cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
  #intro .skip{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font:600 12px Fredoka;color:#fff;opacity:.85;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
  #intro.out{transition:opacity .35s;opacity:0}

  /* ============ PROTOTYPE SWITCHER (top; not part of the design) ============ */
  #switcher{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);z-index:100;
    display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:999px;padding:5px;
    box-shadow:0 6px 24px rgba(0,0,0,.45);font:600 13px system-ui,sans-serif;outline:2px solid #ff2d95;white-space:nowrap}
  #switcher button{background:#2a2a2a;color:#fff;border:0;border-radius:999px;min-width:34px;height:34px;font:600 13px system-ui;cursor:pointer;padding:0 12px}
  #switcher button.on{background:#ff2d95}
  #switcher .tag{font-size:10px;color:#ff7dc0;letter-spacing:1px;padding:0 6px}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div id="switcher">
  <span class="tag">PROTOTYPE</span>
  <button data-v="A">A · Arch</button>
  <button data-v="C">C · Polaroid</button>
  <button id="replay" title="Replay intro">↻</button>
  <button id="mode" title="Toggle intro style"></button>
</div>

<script>
/* ---------- content ---------- */
const HERO = ['IMG-20260807-WA0018.jpg', '50% 40%'];          // #23 pink Happy Birthday backdrop
const LITTLE_GANESH = ['IMG-20260915-WA0004.jpg', '50% 22%']; // #30 Avkrit dressed as Ganesh
// month n = 4th of the month, born 4 Dec 2025. null file → photos/months/mNN.jpg
const MONTHS = [
  [1,'4 Jan',null],[2,'4 Feb',null],[3,'4 Mar',null],
  [4,'4 Apr','IMG-20260408-WA0008.jpg','50% 50%'],
  [5,'4 May','IMG-20260504-WA0003(1).jpg','50% 30%'],
  [6,'4 Jun','IMG-20260605-WA0026.jpg','50% 40%'],
  [7,'4 Jul','IMG-20260705-WA0003.jpg','50% 20%'],
  [8,'4 Aug','IMG-20260804-WA0019.jpg','50% 50%'],
  [9,'4 Sep','IMG-20260904-WA0023.jpg','50% 30%'],
  [10,'4 Oct','IMG-20261004-WA0012.jpg','62% 60%'],
  [11,'4 Nov','WhatsApp Image 2026-11-04 at 11.33.41 PM.jpeg','50% 70%'],
];
const DATE = 'Friday, 4 December 2026';
const STUB = `<div class="stub">⬇ Countdown · Hosts · Schedule · Venue · RSVP · Wishes<br>(not in this prototype)</div>`;

/* ---------- tiny SVG kit ---------- */
const CROWN = `<svg class="crown" viewBox="0 0 64 46" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 38 L8 12 L21 25 L32 5 L43 25 L56 12 L59 38 Z" fill="#f5c542" stroke="#a87b12" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M10 20 L21 29 L32 12 L43 29 L54 20 L56 34 L8 34 Z" fill="#ffd96b" opacity=".6"/>
  <rect x="4" y="35" width="56" height="8" rx="2.5" fill="#e0ab25" stroke="#a87b12" stroke-width="2.2"/>
  <circle cx="32" cy="5" r="3.8" fill="#e53950" stroke="#a87b12"/><circle cx="8" cy="12" r="3.2" fill="#3d7bf0" stroke="#a87b12"/>
  <circle cx="56" cy="12" r="3.2" fill="#3d7bf0" stroke="#a87b12"/><circle cx="20" cy="39" r="2.4" fill="#2fbf55"/>
  <circle cx="32" cy="39" r="2.8" fill="#e53950"/><circle cx="44" cy="39" r="2.4" fill="#2fbf55"/></svg>`;
const BUS = (cls='bus') => `<svg class="${cls}" viewBox="0 0 170 86" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="8" width="156" height="58" rx="12" fill="#ffc928" stroke="#c98f00" stroke-width="3"/>
  <rect x="140" y="16" width="16" height="26" rx="3" fill="#bfe9ff" stroke="#c98f00" stroke-width="2"/>
  ${[14,46,78,110].map(x=>`<rect x="${x}" y="16" width="26" height="20" rx="3" fill="#bfe9ff" stroke="#c98f00" stroke-width="2"/>`).join('')}
  <rect x="4" y="44" width="156" height="5" fill="#2d2a32"/><circle cx="158" cy="56" r="3" fill="#fff6c2"/>
  <circle cx="38" cy="68" r="12" fill="#2d2a32"/><circle cx="38" cy="68" r="4.5" fill="#bbb"/>
  <circle cx="128" cy="68" r="12" fill="#2d2a32"/><circle cx="128" cy="68" r="4.5" fill="#bbb"/></svg>`;
const MELON = (cls='melon') => `<svg class="${cls}" viewBox="0 0 60 34" xmlns="http://www.w3.org/2000/svg">
  <path d="M2 2 A28 28 0 0 0 58 2 Z" fill="#3a9d3a"/><path d="M6 2 A24 24 0 0 0 54 2 Z" fill="#e8f5c8"/>
  <path d="M9 2 A21 21 0 0 0 51 2 Z" fill="#ff5a6e"/>
  ${[[20,9],[30,13],[40,9],[25,17],[35,17]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.4" ry="2.2" fill="#2d2a32"/>`).join('')}</svg>`;
const BALLOON = (c, w, extra='') => `<svg width="${w}" viewBox="0 0 40 80" ${extra} xmlns="http://www.w3.org/2000/svg">
  <path d="M20 2 C8 2 2 12 2 22 C2 34 12 44 20 46 C28 44 38 34 38 22 C38 12 32 2 20 2Z" fill="${c}"/>
  <ellipse cx="13" cy="15" rx="4" ry="7.5" fill="#fff" opacity=".38" transform="rotate(-22 13 15)"/>
  <path d="M17 46 L23 46 L20 50Z" fill="${c}"/><path d="M20 50 q-5 8 0 15 q4 7 0 15" stroke="#6b6b80" fill="none" stroke-width=".9"/></svg>`;
const RAINBOW = ['#f0453a','#ff8c2a','#ffd23f','#2fbf55','#3d7bf0','#8e44ad'];
const PARTY = ['#f0453a','#ff8c2a','#ffd23f','#2fbf55','#3d7bf0','#8e44ad','#ff6fb5','#ffffff'];
let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

const img = (file, pos='50% 50%', alt='Avkrit', ph='Photo coming') =>
  `<img class="photo" style="object-position:${pos}" src="photos/${file.split('/').map(encodeURIComponent).join('/')}" alt="${alt}" loading="lazy"
    onerror="this.outerHTML='<div class=&quot;photo-ph&quot;><div><span>📷</span>${ph}</div></div>'">`;
const monthImg = ([n, , file, pos]) => file
  ? img(file, pos, `Avkrit at ${n} months`)
  : img(`months/m${String(n).padStart(2,'0')}.jpg`, '50% 50%', `Avkrit at ${n} months`, 'Coming soon');
const GANESH = `<div class="ganesh"><img src="assets/img/ganesh.png" alt="Shri Ganesh"
  onerror="this.onerror=null;this.src='assets/img/ganesh-icon.svg'"></div>
  <div class="blessing deva">‖ श्री गणेशाय नमः ‖</div>`;

/* ---------- variants ---------- */
const VARIANTS = {
  A: { name: 'Balloon Arch Stage', html: () => `
    <section class="A">
      <div class="top">
        ${GANESH}
        <div class="lg">${img(...LITTLE_GANESH, 'Avkrit dressed as Ganesh')}</div>
        <div class="lg-cap">Our little Ganesha 🙏</div>
        <div class="kicker">Our Little Prince</div>
      </div>
      <div class="cloud" style="width:70px;height:22px;left:8%;top:300px"></div>
      <div class="cloud" style="width:90px;height:26px;right:6%;top:340px"></div>
      <div class="arch" id="arch">
        <div class="backdrop"></div><div class="rainbow"></div>
        <div class="photo-wrap">${CROWN}${img(...HERO)}</div>
      </div>
      <div class="stage">
        <div class="marquee">${[...'AVKRIT'].map(l=>`<span>${l}</span>`).join('')}</div>
        <div class="turns">turns <b>1</b></div>
        ${BUS('bus')}${MELON('melon')}${MELON('melon melon2')}
        <div style="height:34px"></div>
      </div>
      <div class="info">
        <div class="pill">${DATE} · 6:30 PM</div>
        <div class="venue">📍 Evergreen Compound</div>
        <div class="scroll-cue">Scroll</div>
      </div>
    </section>
    <section class="A-months">
      <h2>12 Little Birthdays</h2>
      <div class="sub">Every 4th, we celebrated one more month of Avkrit</div>
      <div class="grid">
        ${MONTHS.map((m,i)=>`<div class="m" style="--c:${RAINBOW[i%6]}">
          <div class="ball">${monthImg(m)}</div><div class="knot"></div><div class="str"></div>
          <div class="lbl">${m[0]} month${m[0]>1?'s':''}<small>${m[1]}</small></div></div>`).join('')}
        <div class="m big" style="--c:#f5c542">
          <div class="ball"><b>1</b></div><div class="knot"></div><div class="str"></div>
          <div class="lbl">1 year!<small>4 Dec · see you there</small></div></div>
      </div>
    </section>${STUB}`,
    after: buildArch },

  C: { name: 'Storybook Polaroid', html: () => `
    <section class="C">
      ${GANESH}
      <div class="lg">${img(...LITTLE_GANESH, 'Avkrit dressed as Ganesh')}<div class="cap">our little Ganesha</div></div>
      <div class="bunch">
        ${BALLOON('#ff6fb5',58,'style="left:22%;top:18px;transform:rotate(-14deg)"')}
        ${BALLOON('#3d7bf0',64,'style="left:36%;top:0;transform:rotate(-4deg)"')}

function buildArch(){
  const box = document.getElementById('arch'); if(!box) return;
  box.querySelectorAll('.b').forEach(n=>n.remove());
  seed = 11;
  const W = box.clientWidth, H = box.clientHeight, cx = W/2, cy = H*0.98, rx = W*0.43, ry = H*0.86, N = 26;
  for(let i=0;i<=N;i++){
    const t = i/N, th = Math.PI*(1-t), band = RAINBOW[Math.min(5, Math.floor(t*6))];
    for(let k=0;k<3;k++){
      const s = W*(0.085 + rnd()*0.05);
      const x = cx + rx*Math.cos(th) + (rnd()-.5)*W*0.06;
      const y = cy - ry*Math.sin(th) + (rnd()-.5)*W*0.06;
      const c = rnd()<.25 ? '#ffffff' : band;
      box.insertAdjacentHTML('beforeend', `<div class="b" style="--c:${c};width:${s}px;height:${s*1.05}px;left:${x}px;top:${y}px"></div>`);
    }
  }
}

/* ---------- intro ---------- */
function playIntro(mode){
  document.getElementById('intro')?.remove();
  const el = document.createElement('div'); el.id = 'intro';
  seed = 3;
  if(mode === 'confetti'){
    el.className = 'confetti';
    el.innerHTML = Array.from({length:90},()=>{
      const a = rnd()*Math.PI*2, r = 160+rnd()*320;
      return `<i class="cf" style="background:${PARTY[Math.floor(rnd()*PARTY.length)]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r+200}px;--rot:${rnd()*720}deg;--d:${1.4+rnd()*1}s"></i>`;
    }).join('');
  } else {
    el.innerHTML = `<div class="bg"></div>` + Array.from({length:34},()=>{
      const w = 54 + rnd()*44, x = rnd()*100, y = 8 + rnd()*95;
      return `<div class="ib" style="left:calc(${x}% - ${w/2}px);top:${y}%;--d:${1.5+rnd()*.8}s;--delay:${.5+rnd()*.6}s;--rot:${(rnd()-.5)*40}deg">${BALLOON(PARTY[Math.floor(rnd()*7)],w)}</div>`;
    }).join('');
  }
  el.insertAdjacentHTML('beforeend', `<div class="hello">${CROWN}<div class="t">Avkrit turns 1</div></div><div class="skip">tap to skip</div>`);
  document.body.appendChild(el);
  const done = () => { el.classList.add('out'); setTimeout(()=>el.remove(), 350); clearTimeout(timer); };
  const timer = setTimeout(done, 2600);
  el.addEventListener('pointerdown', done, {once:true});
}

/* ---------- switcher ---------- */
const params = new URLSearchParams(location.search);
let cur = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
let mode = params.get('intro') === 'confetti' ? 'confetti' : 'balloons';

function render(intro=true){
  const v = VARIANTS[cur];
  document.getElementById('app').innerHTML = v.html();
  v.after && requestAnimationFrame(v.after);
  document.querySelectorAll('#switcher [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === cur));
  document.getElementById('mode').textContent = mode === 'balloons' ? '🎈' : '🎉';
  const p = new URLSearchParams(location.search); p.set('variant', cur); p.set('intro', mode);
  try { history.replaceState(null, '', '?' + p.toString()); } catch(e) {}
  window.scrollTo(0,0);
  if(intro) playIntro(mode);
}
document.querySelectorAll('#switcher [data-v]').forEach(b => b.onclick = () => { cur = b.dataset.v; render(); });
document.getElementById('replay').onclick = () => playIntro(mode);
document.getElementById('mode').onclick = () => { mode = mode === 'balloons' ? 'confetti' : 'balloons'; render(); };
document.addEventListener('keydown', e => {
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ cur = cur === 'A' ? 'C' : 'A'; render(); }
});
addEventListener('resize', () => VARIANTS[cur].after && VARIANTS[cur].after());
render();
</script>
